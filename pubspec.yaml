name: potential
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  flutter_bloc: ^8.1.6
  go_router: ^14.2.7
  equatable: ^2.0.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets: 
    - assets/

flutter_native_splash:
  color: "#000000"
  image: assets/logo.png
  ios: true
  android: true
  android_gravity: center
  ios_content_mode: center


